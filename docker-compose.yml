services:
    postgres:
        image: postgres:16
        container_name: wavy_pad_pg
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5433:5432"
        volumes:
            - wavy_pad_pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U wavy -d wavy_pad_dev"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    wavy_pad_pg_data:
